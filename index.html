<!DOCTYPE html>
<html>
<head>
  <title>Clickable Box</title>
</head>
<body>

<div onclick="showMessage()" 
     style="width:200px;
            height:100px;
            background-color:lightblue;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            border-radius:10px;
            font-size:18px;">
  Click Me
</div>

<script>
function showMessage() {
  alert("tu pagal hai");
}
</script>

</body>
</html>
